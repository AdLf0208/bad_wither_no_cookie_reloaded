[package]
# Port of Bad Wither No Cookie Reloaded 3.20.4 (Kreezxil / Eleksploded, MIT),
# Minecraft Java 1.21.1 NeoForge, commit 112fa60559f1152141eb38515c9b85ada36b3b9f of
# https://gitlab.com/kreezxil/BadWitherNoCookie. Clean-room Rust rewrite: the upstream
# source was read for its rules only, no Java code or asset is translated. The port
# targets Horizon 26.3 at the pin in horizon-mod.toml and stays local-only until the
# maintainer approves publishing (ARCHITECTURE.md section 8); publishable under MIT.
#
# Cargo's package name and version are not the mod's identity: horizon-mod.toml is.
name = "bwncr"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Bad Wither No Cookie Reloaded for Horizon: the sound-silencing policy"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). Any other
# registry dependency must be pinned with `horizon-launcher native-lock .` first.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
